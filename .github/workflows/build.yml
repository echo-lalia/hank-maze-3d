# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Get Godot Version
        run: |
          GODOT_VERSION=$(grep '^config/features' $WORKING_DIRECTORY/project.godot | cut -d "\"" -f 2)
          echo "GODOT_VERSION=$GODOT_VERSION" >> $GITHUB_ENV

      - uses: Daniel-Griffiths/godot-deploy@master
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: Latest Build
          files: |
            build/windows/windows.exe
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
