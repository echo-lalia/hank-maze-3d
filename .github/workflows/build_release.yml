name: BuildRelease

# Controls when the workflow will run
on: 
  workflow_dispatch:
    inputs:
      releaseTag:
        description: "Tag to use when creating release."
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
        contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: echo-lalia/godot-deploy@d9798c2ed6b98900058a27d12bd989f47b31195a
        with:
          godot-version: "4.8"
          godot-channel: "beta1"
          platforms: "windows"
          file-name: "hank"
          itch-io-api-key: ${{ secrets.ITCH_IO_API_KEY }}
          itch-io-user: "echo-lalia"
          itch-io-game: "hankmaze3d"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ inputs.releaseTag }}
          name: ${{ inputs.releaseTag }}
          files: |
            build/windows/hank.exe
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
